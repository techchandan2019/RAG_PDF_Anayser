spring.application.name=SpringBoot-ai-agent-RAG

server.port=4041
spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=llama3.2:latest
spring.ai.ollama.chat.options.model=gemma4:e2b
spring.ai.ollama.chat.options.temperature=0.7
#spring.ai.ollama.chat.options.format=json


# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/vectordb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Database timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'


# ==========================================
# OLLAMA EMBEDDING MODEL
# ==========================================
spring.ai.ollama.embedding.options.model=nomic-embed-text


# ==========================================
# PGVECTOR CONFIGURATION
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=true

# nomic-embed-text produces 768-dimensional embeddings
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.table-name=vector_store

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
